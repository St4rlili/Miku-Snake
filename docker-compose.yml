services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node server.js"
    env_file: .env
    environment:
      HOST: 0.0.0.0
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  web:
    image: php:8.3-cli
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t web
    env_file: .env
    environment:
      NODE_API_URL: http://api:3000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - api

volumes:
  node_modules:
